
services:

  # ── PHP + Apache ──────────────────────────────────────────
  app:
    build: .
    container_name: puppyco_app
    restart: unless-stopped
    ports:
      - "8080:80"           # acesse em http://localhost:8080
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_NAME=puppyco
      - DB_USER=puppyco_user
      - DB_PASS=puppyco_pass
    volumes:
      - .:/var/www/html/    

  # ── MySQL ─────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: puppyco_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE:      puppyco
      MYSQL_USER:          puppyco_user
      MYSQL_PASSWORD:      puppyco_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3307:3306"         
    volumes:
      - db_data:/var/lib/mysql                    
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql 
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── phpMyAdmin ────────────────────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: puppyco_pma
    restart: unless-stopped
    ports:
      - "8081:80"          
    environment:
      PMA_HOST: db
      PMA_USER: puppyco_user
      PMA_PASSWORD: puppyco_pass
    depends_on:
      - db

volumes:
  db_data: